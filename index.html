<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>每日打卡</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="每日打卡">
<meta name="theme-color" content="#C4836A">
<link rel="apple-touch-icon" href="icons/icon-192x192.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F0EB;--card:#FFF;--text:#2C2C2C;--dim:#8A8480;--accent:#C4836A;--accent-dark:#9B5E47;--accent-light:#F0DDD4;--border:#E4DDD6;--green:#5BA05B;--green-light:#E8F5E8;--blue:#5B8EC4;--yellow:#E8C84A;--red-light:#FDECEC;--timer-active:#D4663A;--timer-bg:#FFF5F0;--rest-color:#8B6EC4;--rest-bg:#F3EEFA}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:15px;min-height:100vh;-webkit-tap-highlight-color:transparent;user-select:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.top-bar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px 10px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top-bar h1{font-size:20px;font-weight:900;color:var(--accent-dark)}
.top-bar .date-display{font-size:13px;color:var(--dim)}
.total-timer-bar{background:var(--card);border-bottom:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:52px;z-index:99}
.tt-label{font-size:13px;color:var(--dim)}
.tt-time{font-size:22px;font-weight:900;color:var(--accent-dark);font-variant-numeric:tabular-nums}
.tt-btn{padding:5px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);font-size:12px;font-weight:700;color:var(--dim);cursor:pointer;font-family:inherit}
.tt-btn.active{background:var(--timer-bg);border-color:var(--timer-active);color:var(--timer-active)}
.view-toggle{display:flex;margin:12px 20px 0;background:var(--card);border-radius:10px;border:1px solid var(--border);overflow:hidden}
.view-btn{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:700;color:var(--dim);cursor:pointer;border:none;background:none}
.view-btn.active{background:var(--accent);color:#fff}
.container{max-width:800px;margin:0 auto;padding:0 20px 100px}
.progress-section{display:flex;align-items:center;gap:20px;padding:16px 0}
.ring-wrap{position:relative;width:72px;height:72px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--border);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:18px;font-weight:900;color:var(--green)}
.progress-info{flex:1}
.done-count{font-size:14px;color:var(--dim)}
.streak{font-size:13px;color:var(--accent);font-weight:700;margin-top:2px}
.category{margin-top:14px}
.cat-header{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.cat-left{display:flex;align-items:center;gap:10px}
.cat-dot{width:10px;height:10px;border-radius:50%}
.cat-name{font-size:15px;font-weight:700}
.cat-progress{font-size:12px;color:var(--dim);background:var(--green-light);padding:2px 8px;border-radius:10px}
.cat-items{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:6px}
.check-row{padding:12px 16px;border-bottom:1px solid #F0EBE6}
.check-row:last-child{border-bottom:none}
.check-row.done{opacity:.4}
.check-top{display:flex;align-items:flex-start;gap:12px}
.checkbox{flex-shrink:0;width:24px;height:24px;border-radius:7px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;margin-top:1px;cursor:pointer}
.check-row.done .checkbox{background:var(--green);border-color:var(--green)}
.checkbox::after{content:'';display:none}
.check-row.done .checkbox::after{content:'✓';display:block;color:#fff;font-size:14px;font-weight:700}
.check-info{flex:1;cursor:pointer}
.check-title{font-size:14.5px;font-weight:500;line-height:1.5}
.check-row.done .check-title{text-decoration:line-through}
.check-right{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-top:2px}
.check-time{font-size:11px;color:var(--accent);font-weight:700;background:var(--accent-light);padding:2px 8px;border-radius:6px}
.toggle-detail{font-size:11px;color:var(--blue);cursor:pointer;padding:2px 0}
.check-detail{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.6;display:none;padding-left:36px}
.check-detail.show{display:block}
.timer-steps{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;padding-left:36px}
.step-btn{display:flex;align-items:center;gap:3px;padding:4px 10px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);font-size:11.5px;font-weight:700;color:var(--dim);cursor:pointer;white-space:nowrap;font-family:inherit}
.step-btn:active{transform:scale(.95)}
.step-btn.running{background:var(--timer-bg);border-color:var(--timer-active);color:var(--timer-active);animation:pulse 1.5s ease-in-out infinite}
.step-btn.rest-running{background:var(--rest-bg);border-color:var(--rest-color);color:var(--rest-color);animation:pulse-r 1.5s ease-in-out infinite}
.step-btn.completed{background:var(--green-light);border-color:var(--green);color:var(--green)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,102,58,.15)}50%{box-shadow:0 0 0 5px rgba(212,102,58,.08)}}
@keyframes pulse-r{0%,100%{box-shadow:0 0 0 0 rgba(139,110,196,.15)}50%{box-shadow:0 0 0 5px rgba(139,110,196,.08)}}
.floating-timer{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:14px;font-weight:700;display:none;align-items:center;gap:10px;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.2);cursor:pointer;max-width:calc(100% - 40px);padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.floating-timer.show{display:flex}
.ft-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:500;opacity:.8}
.ft-time{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.ft-stop{background:rgba(255,255,255,.2);border:none;color:#fff;width:26px;height:26px;border-radius:50%;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.stat-num{font-size:24px;font-weight:900;color:var(--accent-dark)}
.stat-label{font-size:11px;color:var(--dim);margin-top:2px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:20px}
.cal-weekday{text-align:center;font-size:12px;font-weight:700;color:var(--dim);padding:4px 0}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:14px;font-weight:500;background:var(--card);border:1px solid var(--border);cursor:pointer}
.cal-day.empty{background:transparent;border:none}
.cal-day.today{border-color:var(--accent);border-width:2px}
.cal-day.future{opacity:.3}
.cal-day.complete{background:var(--green);border-color:var(--green);color:#fff}
.cal-day.partial{background:var(--green-light);border-color:#C8E6C8}
.cal-day.missed{background:var(--red-light);border-color:#E8C8C8}
.cal-day .day-pct{font-size:9px;font-weight:700;margin-top:1px}
.cal-day.complete .day-pct{color:rgba(255,255,255,.8)}
.month-header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 12px}
.month-title{font-size:18px;font-weight:900;color:var(--accent-dark)}
.nav-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:16px;cursor:pointer}
.reset-bar{display:flex;gap:8px;padding:16px 0}
.reset-btn{flex:1;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--dim);font-size:13px;cursor:pointer;text-align:center;font-weight:500}
</style>
</head>
<body>
<div class="top-bar"><h1>每日打卡</h1><div class="date-display" id="dateDisplay"></div></div>
<div class="total-timer-bar"><div><div class="tt-label">今日总用时</div></div><div class="tt-time" id="totalTime">0:00</div><button class="tt-btn" id="totalTimerBtn" onclick="toggleTotalTimer()">开始</button></div>
<div class="container">
  <div class="view-toggle"><button class="view-btn active" onclick="showView('today')">今日任务</button><button class="view-btn" onclick="showView('calendar')">30天记录</button></div>
  <div id="todayView">
    <div class="progress-section"><div class="ring-wrap"><svg width="72" height="72" viewBox="0 0 72 72"><circle class="ring-bg" cx="36" cy="36" r="30"/><circle class="ring-fill" id="ringFill" cx="36" cy="36" r="30" stroke-dasharray="188.5" stroke-dashoffset="188.5"/></svg><div class="ring-text" id="ringPct">0%</div></div><div class="progress-info"><div class="done-count" id="doneCount">已完成 0/23 项</div><div class="streak" id="streakDisplay">🔥 连续打卡 0 天</div></div></div>
    <div id="itemsContainer"></div>
    <div style="text-align:center;padding:16px 0;color:var(--dim);font-size:13px">全部做完约 65 分钟</div>
    <div class="reset-bar"><button class="reset-btn" onclick="resetToday()">重置今日</button><button class="reset-btn" onclick="if(confirm('确定清除所有记录？'))clearAll()">清除所有</button></div>
  </div>
  <div id="calendarView" style="display:none">
    <div class="stats-grid"><div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">总打卡天数</div></div><div class="stat-card"><div class="stat-num" id="statStreak">0</div><div class="stat-label">连续打卡</div></div><div class="stat-card"><div class="stat-num" id="statAvg">0%</div><div class="stat-label">平均完成率</div></div></div>
    <div class="month-header"><button class="nav-btn" onclick="changeMonth(-1)">‹</button><div class="month-title" id="monthTitle"></div><button class="nav-btn" onclick="changeMonth(1)">›</button></div>
    <div class="cal-grid" id="calGrid"></div>
    <div id="dayDetail" style="display:none"><div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:10px"><div style="font-weight:700;font-size:15px;margin-bottom:8px" id="dayDetailTitle"></div><div id="dayDetailContent" style="font-size:13px;color:var(--dim)"></div></div></div>
  </div>
</div>
<div class="floating-timer" id="floatingTimer"><div class="ft-name" id="ftName"></div><div class="ft-time" id="ftTime"></div><button class="ft-stop" onclick="event.stopPropagation();stopActiveTimer()">✕</button></div>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
let _audioCtx=null;
function getAudioCtx(){if(!_audioCtx||_audioCtx.state==='closed')_audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(_audioCtx.state==='suspended')_audioCtx.resume();return _audioCtx}
function playStart(){try{const c=getAudioCtx(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=660;o.type='sine';g.gain.setValueAtTime(.25,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.25);o.start();o.stop(c.currentTime+.25)}catch(e){}}
function playEnd(){try{const c=getAudioCtx();[0,.25,.5].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=d===0?780:d===.25?880:1040;o.type='sine';g.gain.setValueAtTime(.4,c.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d+.2);o.start(c.currentTime+d);o.stop(c.currentTime+d+.2)});if(navigator.vibrate)navigator.vibrate([200,100,200,100,200])}catch(e){}}
const ITEMS=[
{id:'r1',cat:0,name:'脚底筋膜球松解',time:'共3分钟',detail:'坐着或站着，筋膜球放脚底，从脚后跟慢慢滚到脚趾方向。遇痛点停住不动20-30秒等疼痛减轻。压力5-7分（10分最痛）。',steps:[{label:'左脚',sec:90},{label:'右脚',sec:90}]},
{id:'r2',cat:0,name:'大腿后侧松解+拉伸',time:'共4分钟',detail:'松解：云望放大腿后侧膝盖上方，单腿做（另一条腿移开增加压力）。慢慢从膝盖上方滚到臀部下方，遇痛点停20-30秒。\n拉伸：坐地上一条腿伸直，身体前俯去够脚尖保持30秒不弹震。',steps:[{label:'左松解',sec:90},{label:'左拉伸',sec:30},{label:'右松解',sec:90},{label:'右拉伸',sec:30}]},
{id:'r3',cat:0,name:'小腿后侧松解+拉伸',time:'共4分钟',detail:'松解：云望放小腿后侧，单腿做压力更大。从脚踝上方滚到膝盖下方。\n拉伸：面墙弓步，后腿伸直脚跟踩地感受小腿拉伸30秒。',steps:[{label:'左松解',sec:90},{label:'左拉伸',sec:30},{label:'右松解',sec:90},{label:'右拉伸',sec:30}]},
{id:'r4',cat:0,name:'臀部深层松解+拉伸',time:'共5分钟',detail:'松解：筋膜球放臀部中间偏外侧（梨状肌+臀中肌），坐上去翘二郎腿增压。也要压臀侧面凹陷处（臀中肌）。找痛点停住不要快速滚。\n拉伸：仰卧翘二郎腿，双手抱下方腿大腿往胸口拉30秒。',steps:[{label:'左松解',sec:120},{label:'左拉伸',sec:30},{label:'右松解',sec:120},{label:'右拉伸',sec:30}]},
{id:'r5',cat:0,name:'大腿前侧松解+拉伸',time:'共4分钟',detail:'松解：趴着云望放大腿前侧，单腿做。从膝盖上方慢慢滚到大腿根部。\n拉伸：站着单腿勾腿（手拉脚背往臀部方向），膝盖朝下不外翻保持30秒。',steps:[{label:'左松解',sec:90},{label:'左拉伸',sec:30},{label:'右松解',sec:90},{label:'右拉伸',sec:30}]},
{id:'r6',cat:0,name:'髂腰肌松解+拉伸',time:'共4分钟',detail:'松解：趴着筋膜球放肚脐斜下方约2-3指宽处，一侧一侧做。轻轻压住不动，遇到麻马上挪开（压到神经）。\n拉伸：跪姿弓步后腿跪地前腿弓步，身体直立往前推髋30秒。',steps:[{label:'左松解',sec:90},{label:'左拉伸',sec:30},{label:'右松解',sec:90},{label:'右拉伸',sec:30}]},
{id:'r7',cat:0,name:'大腿外侧松解+拉伸',time:'共4分钟',detail:'松解：侧躺云望放大腿外侧，必须单腿做。从膝盖外侧上方滚到髋部外侧。含阔筋膜张肌+髂胫束。上面的腿踩地可减压。\n拉伸：交叉腿站立，身体向前腿方向侧弯30秒。',steps:[{label:'左松解',sec:90},{label:'左拉伸',sec:30},{label:'右松解',sec:90},{label:'右拉伸',sec:30}]},
{id:'r8',cat:0,name:'竖脊肌松解+拉伸',time:'共4分钟',detail:'松解：仰卧花生球放脊柱两侧（球夹住脊柱不压骨头）。慢慢上下滚。右侧更紧多做1分钟。\n拉伸：坐着身体侧弯，一只手过头往对侧伸30秒换边。',steps:[{label:'松解',sec:120},{label:'右侧额外',sec:60},{label:'左拉伸',sec:30},{label:'右拉伸',sec:30}]},
{id:'r9',cat:0,name:'腰方肌松解+拉伸',time:'共4分钟',detail:'松解：侧躺筋膜球放腰后方、肋骨下缘和骨盆上缘之间（后腰两侧深处）。一侧做完换另一侧。轻柔地压不要太大力。\n拉伸：站着同侧手叉腰，对侧手过头往叉腰侧弯，感受后腰深处拉伸30秒。',steps:[{label:'左松解',sec:90},{label:'左拉伸',sec:30},{label:'右松解',sec:90},{label:'右拉伸',sec:30}]},
{id:'r10',cat:0,name:'小腿前侧松解+拉伸',time:'共3分钟',detail:'松解：坐着用筋膜球手按小腿前外侧（胫骨外侧肌肉不按骨头），找痛点停留。\n拉伸：跪坐脚背贴地，身体往后坐感受小腿前侧拉伸30秒。',steps:[{label:'左松解',sec:60},{label:'左拉伸',sec:30},{label:'右松解',sec:60},{label:'右拉伸',sec:30}]},
{id:'r11',cat:0,name:'大腿内侧松解+拉伸',time:'共3:30',detail:'松解：趴着一条腿弯曲外展（像青蛙腿），云望放大腿内侧单腿做。从膝盖内侧上方滚到腹股沟方向。\n拉伸：蝴蝶坐（两脚掌合拢膝盖外展）身体前倾30秒。',steps:[{label:'左松解',sec:90},{label:'右松解',sec:90},{label:'蝴蝶坐拉伸',sec:30}]},
{id:'f1',cat:1,name:'足弓训练器 3组×15-20个',time:'共3分钟',detail:'一只脚放训练器上，用脚心拱起来的力（足弓发力）踩，不是用脚趾抓。调到15个脚底就酸的阻力。一只脚做完3组再换。',steps:[{label:'左1组',sec:30},{label:'左2组',sec:30},{label:'左3组',sec:30},{label:'右1组',sec:30},{label:'右2组',sec:30},{label:'右3组',sec:30}]},
{id:'f2',cat:1,name:'短足训练 每脚10次×5秒',time:'共2分钟',detail:'赤脚坐着一只脚放平。脚趾不动不抓地，想象把大脚趾根部往脚跟方向拉足弓自然拱起。看着脚确认脚趾没蜷缩。保持5秒放松做10次换脚。',steps:[{label:'左脚',sec:60},{label:'右脚',sec:60}]},
{id:'f3',cat:1,name:'大脚趾独立下压 每脚10次',time:'共2分钟',detail:'赤脚坐着脚放平。大脚趾用力往下压地面同时小脚趾抬起来→反过来小脚趾压地大脚趾抬→交替做。分不开没关系每天尝试就好。一只脚做完换。',steps:[{label:'左脚',sec:60},{label:'右脚',sec:60}]},
{id:'h1',cat:2,name:'猫牛式找中立位 10次',time:'2分钟',detail:'四点跪姿（手在肩正下方膝盖在髋正下方）。慢慢弓腰（猫式：背上拱低头）→撅屁股（牛式：腰下塌抬头）→反复切换。逐渐缩小幅度停在中间，腰不累不弓就是中立位。',steps:[{label:'开始',sec:120}]},
{id:'h2',cat:2,name:'空手屈髋 20-40个',time:'5分钟',detail:'站直双手摸2号位（屁股侧面凹陷处不是后面！）。站直→微推屁股往后→用手引导2号位往后拉开→脚蹬地用臀部力量拉回站直。每下回到完全站直。慢慢做感受臀部发力。',steps:[{label:'开始',sec:300}]},
{id:'h3',cat:2,name:'中立位站姿保持',time:'1分钟',detail:'站镜子前调到中立位。重心放整个脚掌上（不是后脚跟）。膝盖微弯不锁死。注意重心是否偏到左腿，尽量两腿均匀分配。',steps:[{label:'保持',sec:60}]},
{id:'c1',cat:3,name:'超人式 3组×10-12个',time:'共5:30',detail:'趴地上双手过头伸直双腿伸直。同时轻轻抬起上半身和双腿离地几厘米就够（不要拼命高抬！）。保持2-3秒慢慢放下。下巴微收看地面脖子不上仰。臀部先收紧再抬保护腰。',steps:[{label:'第1组',sec:90},{label:'休息',sec:30,rest:true},{label:'第2组',sec:90},{label:'休息',sec:30,rest:true},{label:'第3组',sec:90}]},
{id:'c2',cat:3,name:'死虫 3组×8个/侧',time:'共5:30',detail:'躺地上腰贴地（做后倾骨盆，你有前倾这步特别重要）。双手指天花板双腿抬起膝盖弯90度。呼气时对侧手脚同时慢慢伸出去，全程腰贴地不拱——腰要拱就缩小幅度。吸气收回换侧。慢做。',steps:[{label:'第1组',sec:90},{label:'休息',sec:30,rest:true},{label:'第2组',sec:90},{label:'休息',sec:30,rest:true},{label:'第3组',sec:90}]},
{id:'c3',cat:3,name:'侧平板支撑 每侧2组×30秒',time:'共2:45',detail:'侧躺前臂撑地肘在肩正下方。胯用力顶起来身体成一条直线（头-肩-胯-脚踝一条线）。不让胯掉。弱的那侧可多做一组。',steps:[{label:'左1组',sec:30},{label:'休息',sec:15,rest:true},{label:'左2组',sec:30},{label:'休息',sec:15,rest:true},{label:'右1组',sec:30},{label:'休息',sec:15,rest:true},{label:'右2组',sec:30}]},
{id:'p1',cat:4,name:'收下巴训练 10次×5秒',time:'1分钟',detail:'靠墙站或仰卧。下巴往回收（做双下巴动作），不是低头是整个头往后平移。保持5秒放松。改善头前引。',steps:[{label:'开始',sec:60}]},
{id:'p2',cat:4,name:'胸前拉伸 每侧30秒',time:'1分钟',detail:'站门框旁把前臂搭门框上（肘跟肩同高），身体慢慢前倾过门框感受胸前和肩前侧拉伸。不耸肩。一侧做完换。',steps:[{label:'左',sec:30},{label:'右',sec:30}]},
{id:'p3',cat:4,name:'吃够了吗？',time:'—',detail:'你44kg，每天蛋白质目标66克（44×1.5）。三餐每餐约22克。训练日训练后2小时内加一勺蛋白粉（20-25克）。\n\n每份约20-25克蛋白质＝一个手掌大的鸡胸肉/牛肉/鱼（约100克）＝2个鸡蛋+1杯牛奶＝一碗豆腐（约200克）＝一勺蛋白粉。\n\n每顿饭：一手掌大的肉/鱼 + 一拳头大的主食 + 一大把蔬菜。训练日多吃半碗饭。\n\n你BMI偏低，每天至少1400-1600大卡，三顿正餐都吃饱不要少吃。',steps:[]},
];
const CATS=[{name:'松解拉伸',color:'#C4836A',ids:['r1','r2','r3','r4','r5','r6','r7','r8','r9','r10','r11']},{name:'足部训练',color:'#5BA05B',ids:['f1','f2','f3']},{name:'空手屈髋 + 中立位',color:'#5B8EC4',ids:['h1','h2','h3']},{name:'核心训练',color:'#E8C84A',ids:['c1','c2','c3']},{name:'体态纠正',color:'#B08AD4',ids:['p1','p2','p3']}];
const TOTAL_ITEMS=ITEMS.length,ITEM_IDS=ITEMS.map(i=>i.id);
let totalTimerInterval=null,totalTimerSeconds=0,totalTimerRunning=false;
function toggleTotalTimer(){const btn=document.getElementById('totalTimerBtn');if(totalTimerRunning){totalTimerRunning=false;clearInterval(totalTimerInterval);btn.textContent='继续';btn.classList.remove('active')}else{totalTimerRunning=true;totalTimerInterval=setInterval(()=>{totalTimerSeconds++;document.getElementById('totalTime').textContent=formatTime(totalTimerSeconds)},1000);btn.textContent='暂停';btn.classList.add('active')}}
let activeTimer=null;
function formatTime(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function startStep(itemId,stepIdx){
  const item=ITEMS.find(i=>i.id===itemId);if(!item||stepIdx>=item.steps.length)return;
  for(let i=0;i<stepIdx;i++){const pb=document.querySelector(`[data-item="${itemId}"][data-step="${i}"]`);if(pb&&!pb.classList.contains('completed'))return}
  const step=item.steps[stepIdx],btn=document.querySelector(`[data-item="${itemId}"][data-step="${stepIdx}"]`);
  if(!btn||btn.classList.contains('completed'))return;
  if(activeTimer){if(activeTimer.itemId===itemId&&activeTimer.stepIdx===stepIdx){if(activeTimer.paused){activeTimer.paused=false;btn.classList.add(step.rest?'rest-running':'running');activeTimer.interval=setInterval(()=>tickStep(),1000)}else{activeTimer.paused=true;clearInterval(activeTimer.interval);btn.classList.remove('running','rest-running')}return}stopActiveTimer()}
  if(!totalTimerRunning)toggleTotalTimer();
  playStart();
  activeTimer={itemId,stepIdx,btn,remaining:step.sec,total:step.sec,name:item.name+' · '+step.label,paused:false,isRest:!!step.rest,interval:setInterval(()=>tickStep(),1000)};
  btn.classList.add(step.rest?'rest-running':'running');btn.querySelector('.s-time').textContent=formatTime(step.sec);updateFloating()
}
function tickStep(){if(!activeTimer)return;activeTimer.remaining--;activeTimer.btn.querySelector('.s-time').textContent=formatTime(activeTimer.remaining);updateFloating();
  if(activeTimer.remaining<=0){clearInterval(activeTimer.interval);playEnd();activeTimer.btn.classList.remove('running','rest-running');activeTimer.btn.classList.add('completed');activeTimer.btn.querySelector('.s-icon').textContent='✓';activeTimer.btn.querySelector('.s-time').textContent='完成';
    const iId=activeTimer.itemId,sIdx=activeTimer.stepIdx,item=ITEMS.find(i=>i.id===iId);activeTimer=null;hideFloating();
    const allDone=item.steps.every((_,i)=>{const b=document.querySelector(`[data-item="${iId}"][data-step="${i}"]`);return b&&b.classList.contains('completed')});
    if(allDone){const row=document.querySelector(`.check-row[data-id="${iId}"]`);if(row&&!row.classList.contains('done')){row.classList.add('done');saveTodayItem(iId,true);updateProgress()}}
    if(sIdx+1<item.steps.length)setTimeout(()=>startStep(iId,sIdx+1),500)}}
function stopActiveTimer(){if(!activeTimer)return;clearInterval(activeTimer.interval);const item=ITEMS.find(i=>i.id===activeTimer.itemId),step=item.steps[activeTimer.stepIdx];activeTimer.btn.classList.remove('running','rest-running');activeTimer.btn.querySelector('.s-icon').textContent='⏱';activeTimer.btn.querySelector('.s-time').textContent=formatTime(activeTimer.total);activeTimer=null;hideFloating()}
function updateFloating(){if(!activeTimer)return;document.getElementById('ftName').textContent=activeTimer.name;document.getElementById('ftTime').textContent=formatTime(activeTimer.remaining);const r=activeTimer.btn.getBoundingClientRect();document.getElementById('floatingTimer').classList.toggle('show',!(r.top>-20&&r.bottom<window.innerHeight+20))}
function hideFloating(){document.getElementById('floatingTimer').classList.remove('show')}
window.addEventListener('scroll',()=>{if(activeTimer)updateFloating()},{passive:true});
document.getElementById('floatingTimer').addEventListener('click',e=>{if(e.target.classList.contains('ft-stop'))return;if(activeTimer)activeTimer.btn.scrollIntoView({behavior:'smooth',block:'center'})});
function renderItems(){const c=document.getElementById('itemsContainer');let h='';
  CATS.forEach((cat,ci)=>{h+=`<div class="category"><div class="cat-header"><div class="cat-left"><div class="cat-dot" style="background:${cat.color}"></div><div class="cat-name">${cat.name}</div></div><div class="cat-progress" id="cat${ci}Progress">0/${cat.ids.length}</div></div><div class="cat-items">`;
    cat.ids.forEach(id=>{const item=ITEMS.find(i=>i.id===id);const dt=item.detail.replace(/\n/g,'<br>');
      h+=`<div class="check-row" data-id="${id}"><div class="check-top"><div class="checkbox" onclick="event.stopPropagation();toggleItem(this.closest('.check-row'))"></div><div class="check-info" onclick="event.stopPropagation();toggleItem(this.closest('.check-row'))"><div class="check-title">${item.name}</div></div><div class="check-right"><div class="check-time">${item.time}</div><div class="toggle-detail" onclick="event.stopPropagation();toggleDetail('${id}')">展开 ▾</div></div></div><div class="check-detail" id="detail-${id}">${dt}</div>`;
      if(item.steps.length>0){h+=`<div class="timer-steps">`;item.steps.forEach((s,si)=>{h+=`<button class="step-btn" data-item="${id}" data-step="${si}" onclick="event.stopPropagation();startStep('${id}',${si})"><span class="s-icon">⏱</span><span class="s-time">${formatTime(s.sec)}</span><span class="s-label">${s.label}</span></button>`});h+=`</div>`}
      h+=`</div>`});h+=`</div></div>`});c.innerHTML=h}
function toggleDetail(id){const el=document.getElementById('detail-'+id);el.classList.toggle('show');const row=el.closest('.check-row'),t=row.querySelector('.toggle-detail');if(t)t.textContent=el.classList.contains('show')?'收起 ▴':'展开 ▾'}
function getDateKey(d){const dd=d||new Date();return dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0')}
function loadData(){try{return JSON.parse(localStorage.getItem('dailyCheck')||'{}')}catch(e){return{}}}
function saveData(d){localStorage.setItem('dailyCheck',JSON.stringify(d))}
function getTodayData(){return loadData()[getDateKey()]||{}}
function saveTodayItem(id,v){const d=loadData(),k=getDateKey();if(!d[k])d[k]={};d[k][id]=v;saveData(d)}
function initToday(){const t=new Date();document.getElementById('dateDisplay').textContent=t.getFullYear()+'年'+(t.getMonth()+1)+'月'+t.getDate()+'日';const td=getTodayData();document.querySelectorAll('.check-row').forEach(r=>{if(td[r.dataset.id])r.classList.add('done');else r.classList.remove('done')});updateProgress()}
function toggleItem(row){const id=row.dataset.id;const isDone=row.classList.toggle('done');saveTodayItem(id,isDone);updateProgress()}
function updateProgress(){const td=getTodayData();let done=0;ITEM_IDS.forEach(id=>{if(td[id])done++});const pct=Math.round(done/TOTAL_ITEMS*100);document.getElementById('ringPct').textContent=pct+'%';document.getElementById('doneCount').textContent='已完成 '+done+'/'+TOTAL_ITEMS+' 项';const circ=2*Math.PI*30;document.getElementById('ringFill').style.strokeDashoffset=circ-(circ*pct/100);CATS.forEach((cat,ci)=>{let cd=0;cat.ids.forEach(id=>{if(td[id])cd++});const el=document.getElementById('cat'+ci+'Progress');if(el)el.textContent=cd+'/'+cat.ids.length});document.getElementById('streakDisplay').textContent='🔥 连续打卡 '+calcStreak()+' 天'}
function calcStreak(){const data=loadData();let streak=0;const today=new Date(),todayKey=getDateKey(today),todayData=data[todayKey]||{};let todayDone=0;ITEM_IDS.forEach(id=>{if(todayData[id])todayDone++});const half=Math.floor(TOTAL_ITEMS*.5);if(todayDone>=half)streak=1;else{const yd=new Date(today);yd.setDate(yd.getDate()-1);const ydData=data[getDateKey(yd)]||{};let yDone=0;ITEM_IDS.forEach(id=>{if(ydData[id])yDone++});if(yDone<half)return 0}let d=new Date(today);if(todayDone<half)d.setDate(d.getDate()-1);while(true){const k=getDateKey(d),dd=data[k]||{};let cnt=0;ITEM_IDS.forEach(id=>{if(dd[id])cnt++});if(cnt>=half){if(d.getTime()!==today.getTime()||todayDone>=half)streak++;d.setDate(d.getDate()-1)}else break;if(streak>365)break}return streak}
function resetToday(){const d=loadData();d[getDateKey()]={};saveData(d);stopActiveTimer();totalTimerRunning=false;clearInterval(totalTimerInterval);totalTimerSeconds=0;document.getElementById('totalTime').textContent='0:00';document.getElementById('totalTimerBtn').textContent='开始';document.getElementById('totalTimerBtn').classList.remove('active');document.querySelectorAll('.step-btn').forEach(b=>{b.classList.remove('completed','running','rest-running');b.querySelector('.s-icon').textContent='⏱';const item=ITEMS.find(i=>i.id===b.dataset.item);if(item){const s=item.steps[parseInt(b.dataset.step)];if(s)b.querySelector('.s-time').textContent=formatTime(s.sec)}});initToday()}
function clearAll(){localStorage.removeItem('dailyCheck');resetToday();if(document.getElementById('calendarView').style.display!=='none')renderCalendar()}
function showView(v){document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));if(v==='today'){document.getElementById('todayView').style.display='block';document.getElementById('calendarView').style.display='none';document.querySelectorAll('.view-btn')[0].classList.add('active')}else{document.getElementById('todayView').style.display='none';document.getElementById('calendarView').style.display='block';document.querySelectorAll('.view-btn')[1].classList.add('active');renderCalendar()}}
let calMonth=new Date().getMonth(),calYear=new Date().getFullYear();
function changeMonth(delta){calMonth+=delta;if(calMonth>11){calMonth=0;calYear++}if(calMonth<0){calMonth=11;calYear--}renderCalendar()}
function renderCalendar(){const data=loadData(),today=new Date(),todayKey=getDateKey(today);document.getElementById('monthTitle').textContent=calYear+'年'+(calMonth+1)+'月';const firstDay=new Date(calYear,calMonth,1).getDay(),daysInMonth=new Date(calYear,calMonth+1,0).getDate();let html='';['日','一','二','三','四','五','六'].forEach(d=>{html+='<div class="cal-weekday">'+d+'</div>'});for(let i=0;i<firstDay;i++)html+='<div class="cal-day empty"></div>';let totalDays=0,totalPct=0;for(let d=1;d<=daysInMonth;d++){const date=new Date(calYear,calMonth,d),key=getDateKey(date),dayData=data[key]||{};let done=0;ITEM_IDS.forEach(id=>{if(dayData[id])done++});const pct=Math.round(done/TOTAL_ITEMS*100);const isToday=key===todayKey,isFuture=date>today;let cls='cal-day';if(isToday)cls+=' today';if(isFuture)cls+=' future';else if(done>0){totalDays++;totalPct+=pct;if(pct>=80)cls+=' complete';else if(pct>0)cls+=' partial'}else if(!isToday&&date<today&&Math.floor((today-date)/86400000)<=30)cls+=' missed';html+='<div class="'+cls+'" onclick="showDayDetail(\''+key+'\','+d+')"><div class="day-num">'+d+'</div>';if(!isFuture&&done>0)html+='<div class="day-pct">'+pct+'%</div>';html+='</div>'}document.getElementById('calGrid').innerHTML=html;document.getElementById('statTotal').textContent=totalDays;document.getElementById('statStreak').textContent=calcStreak();document.getElementById('statAvg').textContent=totalDays>0?Math.round(totalPct/totalDays)+'%':'0%'}
function showDayDetail(key,dayNum){const data=loadData(),dayData=data[key]||{};let done=0;ITEM_IDS.forEach(id=>{if(dayData[id])done++});if(!done){document.getElementById('dayDetail').style.display='none';return}document.getElementById('dayDetail').style.display='block';document.getElementById('dayDetailTitle').textContent=(calMonth+1)+'月'+dayNum+'日 · 完成 '+done+'/'+TOTAL_ITEMS;let content='';ITEM_IDS.forEach(id=>{const item=ITEMS.find(i=>i.id===id);if(dayData[id])content+='<span style="color:var(--green)">✓</span> '+item.name+'　';else content+='<span style="opacity:.3">✗ '+item.name+'</span>　'});document.getElementById('dayDetailContent').innerHTML=content}
renderItems();initToday();
</script>
